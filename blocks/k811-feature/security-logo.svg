<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 240" role="img" aria-labelledby="k811t k811d">
<title id="k811t">Kotak811 animated mark</title>
<desc id="k811d">The 811 logo (two stacked circles and two slanted bars) morphs into a symmetric converged mark, holds, then returns.</desc>
<!--
  Two-state SMIL ping-pong on a 6s loop with balanced holds so BOTH states are
  clearly visible:
    A = 811 logo  (stacked circles left, slanted "11" bars right, dots hidden)
    B = converged (side-by-side circles, vertical bars, dots visible)
  keyTimes: hold A 0-40%, morph to B, hold B 50-90%, morph back to A.
-->
<g fill="none" stroke="#263943" stroke-width="2" stroke-linejoin="round">
  <!-- big circle 1 (top of the 8 -> left of converged) -->
  <circle r="50">
    <animate attributeName="cx" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="55;55;70;70;55"/>
    <animate attributeName="cy" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="70;70;120;120;70"/>
  </circle>
  <!-- big circle 2 (bottom of the 8 -> right of converged) -->
  <circle r="50">
    <animate attributeName="cx" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="55;55;160;160;55"/>
    <animate attributeName="cy" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="170;170;120;120;170"/>
  </circle>
  <!-- centre dot 1 (hidden in 811, grows in converged) -->
  <circle r="0.5">
    <animate attributeName="cx" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="55;55;70;70;55"/>
    <animate attributeName="cy" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="70;70;120;120;70"/>
    <animate attributeName="r" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="0.5;0.5;15;15;0.5"/>
  </circle>
  <!-- centre dot 2 -->
  <circle r="0.5">
    <animate attributeName="cx" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="55;55;160;160;55"/>
    <animate attributeName="cy" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="170;170;120;120;170"/>
    <animate attributeName="r" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="0.5;0.5;15;15;0.5"/>
  </circle>
  <!-- bar 1 (slanted "1" -> vertical) -->
  <polygon>
    <animate attributeName="points" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="162,20 206,20 149,220 105,220;162,20 206,20 149,220 105,220;95,20 138,20 138,220 95,220;95,20 138,20 138,220 95,220;162,20 206,20 149,220 105,220"/>
  </polygon>
  <!-- bar 2 (slanted "1" -> vertical) -->
  <polygon>
    <animate attributeName="points" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.4;0.5;0.9;1" keySplines=".3 0 .1 1;.3 0 .1 1;.3 0 .1 1;.3 0 .1 1"
      values="219,20 263,20 206,220 162,220;219,20 263,20 206,220 162,220;95,20 138,20 138,220 95,220;95,20 138,20 138,220 95,220;219,20 263,20 206,220 162,220"/>
  </polygon>
</g>
</svg>
