<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Kotak811 logo">
<style>
/* Assemble loop: each element slides up + fades in and its stroke draws on,
   staggered; the logo holds fully assembled for most of the 5s cycle, then
   resets and replays. Looping keeps it visible regardless of decode/scroll
   timing. translate-only transforms are origin-independent (safe on the
   matrix-positioned groups). */
.k811sec-el { animation: k811sec-assemble 5s ease-in-out infinite; }
.k811sec-p {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: k811sec-draw 5s ease-in-out infinite;
}

.k811sec-2 { animation-delay: .1s; }
.k811sec-3 { animation-delay: .2s; }
.k811sec-4 { animation-delay: .3s; }
.k811sec-5 { animation-delay: .85s; }
.k811sec-6 { animation-delay: .95s; }

@keyframes k811sec-assemble {
  0%   { opacity: 0; transform: translateY(48px); }
  22%  { opacity: 1; transform: translateY(0); }
  88%  { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(48px); }
}

@keyframes k811sec-draw {
  0%   { stroke-dashoffset: 1; }
  28%  { stroke-dashoffset: 0; }
  90%  { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .k811sec-el { animation: none; opacity: 1; transform: none; }
  .k811sec-p { animation: none; stroke-dashoffset: 0; }
}
</style>
