version: 1

indices:
  en:
    include:
      - '/en/**'
    exclude:
      - '/**.json'
      - '/en/nav'
      - '/en/footer'
      - '/en/fragments/**'
      - '/en/search'
      - '/en/apply'
      - '/en/track-application'
      - '/en/compareapi-integration'
    target: /en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")

  hi:
    include:
      - '/hi/**'
    exclude:
      - '/**.json'
      - '/hi/nav'
      - '/hi/footer'
      - '/hi/fragments/**'
      - '/hi/search'
      - '/hi/apply'
      - '/hi/track-application'
      - '/hi/compareapi-integration'
    target: /hi/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
